version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    codeql-actions:
      patterns:
        - "github/codeql-action/*"
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/abstractions
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/serialization/json
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/serialization/form
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/serialization/text
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/serialization/multipart
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/http
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: /components/authentication/oauth
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
